name: Atualizar painel ENADE

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checar INEP/MEC e regenerar o painel
        working-directory: src
        run: |
          python check_inep.py
          python gen.py

      - name: Publicar se houve mudanca
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem mudancas nesta semana."
          else
            git commit -m "Atualizacao automatica do painel"
            git push
          fi
